<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    .container { text-align: center; max-width: 400px; padding: 2rem; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p  { font-size: 0.875rem; color: #64748b; margin: 0.5rem 0 0; }
    .error h1 { color: #f87171; }
    a { color: #3b82f6; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Default: loading state -->
  <div class="container" id="loading">
    <div class="spinner"></div>
    <h1>Signing you in&hellip;</h1>
    <p>Completing BrowserStack authentication.</p>
  </div>

  <!-- Error state (hidden until needed) -->
  <div class="container error" id="errorState" style="display:none">
    <h1 id="errorTitle">Authentication failed</h1>
    <p id="errorMessage"></p>
    <p><a id="errorLink" href="/">Return to app</a></p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code   = params.get('code');
      var state  = params.get('state');
      var error  = params.get('error');

      function showError(title, message) {
        document.getElementById('loading').style.display = 'none';
        var errorDiv = document.getElementById('errorState');
        errorDiv.style.display = 'block';
        // Safe DOM assignment — no innerHTML with user data
        document.getElementById('errorTitle').textContent   = title;
        document.getElementById('errorMessage').textContent = message;
        document.getElementById('errorLink').href           = getBaseHref();
      }

      if (error) {
        var desc = params.get('error_description') || error;
        showError('Authentication failed', desc);
        return;
      }

      if (!code) {
        showError('No authorization code', 'The login response was missing a code. Please try again.');
        return;
      }

      // Derive baseHref by stripping 'auth-callback.html' from pathname
      var base = getBaseHref();
      var dest = base + '#/auth/callback?code=' + encodeURIComponent(code);
      if (state) dest += '&state=' + encodeURIComponent(state);

      window.location.replace(dest);
    })();

    function getBaseHref() {
      var path = window.location.pathname;
      var idx  = path.lastIndexOf('auth-callback.html');
      return idx !== -1
        ? window.location.origin + path.slice(0, idx)
        : window.location.origin + '/';
    }
  </script>
</body>
</html>
